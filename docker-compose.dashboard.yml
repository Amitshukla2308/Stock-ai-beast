version: '3.8'

services:
  backend:
    build:
      context: ./dashboard/backend
    volumes:
      - ./data:/app/data:ro # Read-only access to existing database folder
    environment:
      - DB_PATH=/app/data/trading.db
    ports:
      - "8005:8000"

  frontend:
    build:
      context: ./dashboard/frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  brain-viewer:
    build:
      context: ./dashboard/brain
    volumes:
      - ./data:/app/data:ro
    ports:
      - "8501:8501"
