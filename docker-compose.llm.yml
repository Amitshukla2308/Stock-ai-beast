services:
  redis:
    image: redis:7-alpine
    container_name: beast_redis
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - beast_net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  vllm:
    image: vllm/vllm-openai:latest
    container_name: beast_brain
    runtime: nvidia
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
    volumes:
      - /mnt/d/AI_HUB/models/huggingface:/root/.cache/huggingface
    ports:
      - "8000:8000"
    ipc: host
    command: >
      --model Qwen/Qwen2.5-32B-Instruct-AWQ --quantization awq --dtype half --gpu-memory-utilization 0.90 --max-model-len 8192 --enforce-eager
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    networks:
      - beast_net
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  beast-engine:
    build: .
    container_name: beast_engine
    command: tail -f /dev/null
    environment:
      - REDIS_HOST=beast_redis
      - REDIS_PORT=6379
      - VLLM_API_BASE=http://beast_brain:8000/v1
      - VLLM_API_KEY=EMPTY
      - MODEL_NAME=Qwen/Qwen2.5-32B-Instruct-AWQ
      - FYERS_CLIENT_ID=${FYERS_CLIENT_ID}
      - FYERS_SECRET_ID=${FYERS_SECRET_ID}
      - TRADING_MODE=PAPER
    volumes:
      - ${PWD}:/app
      - ${PWD}/data:/app/data # Keep specific data mount if needed, but root mount covers it      - ${PWD}/logs:/app/logs
    depends_on:
      vllm:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - beast_net

  beast-producer:
    build: .
    container_name: beast_producer
    command: tail -f /dev/null
    environment:
      - REDIS_HOST=beast_redis
      - REDIS_PORT=6379
    volumes:
      - ${PWD}/data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - beast_net

networks:
  beast_net:
    driver: bridge
